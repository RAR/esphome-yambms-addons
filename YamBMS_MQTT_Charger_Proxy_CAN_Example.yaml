# +--------------------------------------+
# | MQTT Charger Proxy - CAN Example     |
# +--------------------------------------+
# YamBMS data from MQTT → LuxPower CAN output with charge control.
# The MQTT twin of YamBMS_Charger_Proxy_CAN_Example.yaml: the same
# charger package, fed from YamBMS's MQTT topics instead of its BLE
# server, so the proxy can sit anywhere on the network.
# See CHARGER_PROXY_README.md for the charger package's controls.

esphome:
  name: charger-proxy-can-mqtt
  friendly_name: "Charger Proxy CAN MQTT"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# The same broker YamBMS publishes to.
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_client
  log_topic: null
  discovery: false      # entities reach Home Assistant over the API already
  idf_send_async: true  # sync publishes can stall the loop when WiFi stalls

# +--------------------------------------+
# | Proxy Configuration                  |
# +--------------------------------------+
substitutions:
  proxy_id: 'ew_proxy'
  # YamBMS's topics up to /sensor/..., e.g. yambms/yambms_1 for
  # yambms/yambms_1/sensor/battery_soc/state
  yambms_prefix: 'yambms/yambms_1'  # <- Check against your broker!

# +--------------------------------------+
# | CAN bus hardware                     |
# +--------------------------------------+
# ESP32 built-in CAN (TWAI) controller. Adjust TX/RX pins to your
# wiring. The charger package extends this bus to listen for the
# inverter ACK (0x305) and to send the LuxPower frames.
canbus:
  - platform: esp32_can
    id: canbus_proxy
    tx_pin: GPIO5
    rx_pin: GPIO4
    can_id: 1
    bit_rate: 500kbps

# +--------------------------------------+
# | MQTT Client + Charger CAN packages   |
# +--------------------------------------+
packages:
  # MQTT Client - subscribes to YamBMS's state topics
  yambms_mqtt:
    url: https://github.com/RAR/esphome-yambms-addons
    ref: main
    refresh: 0s
    files:
      - path: 'packages/inverter/inverter_proxy_mqtt_client.yaml'

  # Charger CAN - LuxPower output with charge control
  charger_can:
    url: https://github.com/RAR/esphome-yambms-addons
    ref: main
    refresh: 0s
    files:
      - path: 'packages/charger/charger_proxy_canbus.yaml'
        vars:
          charger_id: 'charger_can'
          charger_name: 'Charger CAN'
          canbus_node_id: 'canbus_proxy'
          # charger_charge_control: 'false'   # uncomment for monitoring-only

# +--------------------------------------+
# | Setup Instructions                   |
# +--------------------------------------+
# 1. Enable mqtt: on the YamBMS node
# 2. Find its topics: mosquitto_sub -v -t '#' and set yambms_prefix
# 3. Adjust CAN TX/RX pins for your board
# 4. Flash this node; "YamBMS Link" turns on once voltage, CVL and
#    CCL have arrived
# 5. Connect CAN bus to the inverter/charger (CAN-H / CAN-L)
#    - Add 120Ω termination resistor if needed
# 6. Set the inverter's battery protocol to LuxPower
# 7. Toggle "Charge Enable" switch in HA to control charging
