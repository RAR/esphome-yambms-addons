# Charger CAN Proxy - LuxPower protocol output with charge control
# GitHub: https://github.com/RAR/esphome-yambms-addons
#
# CAN-bus sibling of charger_proxy_rs485.yaml. Emits the LuxPower CAN
# frame set (0x35E/0x351/0x355/0x356/0x359/0x35C) using BLE-sourced
# YamBMS data, and layers on the same charge-control behaviour as the
# RS485 charger proxy: Charge Enable switch, CVL/CCL overrides,
# monitoring-only mode, and active charge blocking.
#
# Used as a remote package with vars:
#   packages:
#     charger_can:
#       url: https://github.com/RAR/esphome-yambms-addons
#       ref: main
#       files:
#         - path: 'packages/charger/charger_proxy_canbus.yaml'
#           vars:
#             charger_id: 'charger_can'
#             charger_name: 'Charger CAN'
#             canbus_node_id: 'canbus_proxy'
#             charger_charge_control: 'true'   # optional, default true
#
# Required vars:
#   charger_id:               Unique ID (e.g., 'charger_can')
#   charger_name:             Display name (e.g., 'Charger CAN')
#   canbus_node_id:           ID of the CAN hardware bus defined at top level
#                             (esp32_can or mcp2515 platform). This package
#                             extends it to listen for the inverter ACK.
#
# Optional vars:
#   charger_charge_control:   Enable charge control entities and blocking
#                             (default: 'true'). Set to 'false' for
#                             monitoring-only output.
#
# Also requires ${proxy_id} from top-level substitutions
# (references shared BLE client sensors from inverter_proxy_ble_client.yaml).
#
# Protocol: LuxPower (broadcast). Frames are sent round-robin every 100ms
# once the inverter is seen (0x305 ACK) or after a periodic kickstart.
# The proxy responds as if it were the battery BMS.

substitutions:
  charger_charge_control: 'true'
  charger_can_link_timer: '5s'

globals:
  - id: ${charger_id}_can_send_data
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ${charger_id}_can_frame
    type: int
    restore_value: no
    initial_value: "0"
  - id: ${charger_id}_can_frame_index
    type: int
    restore_value: no
    initial_value: "-1"
  - id: ${charger_id}_inverter_ack_ms_previous
    type: uint32_t
    restore_value: no
    initial_value: "0"

switch:
  - platform: template
    name: "${ charger_name + ' Charge Enable' if charger_charge_control == 'true' else '' }"
    id: ${charger_id}_charge_enable
    icon: "${ 'mdi:battery-charging' if charger_charge_control == 'true' else '' }"
    internal: "${ 'false' if charger_charge_control == 'true' else 'true' }"
    optimistic: true
    restore_mode: "${ 'RESTORE_DEFAULT_ON' if charger_charge_control == 'true' else 'ALWAYS_ON' }"
    entity_category: "${ 'config' if charger_charge_control == 'true' else '' }"

binary_sensor:
  - platform: template
    id: ${charger_id}_can_status
    name: "${charger_name} CAN Status"
    entity_category: diagnostic

sensor:
  - platform: template
    id: ${charger_id}_inverter_heartbeat
    name: "${charger_name} Inverter Heartbeat"
    unit_of_measurement: "ms"
    device_class: duration
    accuracy_decimals: 0
    icon: "mdi:update"
    entity_category: diagnostic
  - platform: template
    id: ${charger_id}_sent_cvl
    name: "${ charger_name + ' Sent CVL' if charger_charge_control == 'true' else '' }"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: "mdi:flash"
    internal: "${ 'false' if charger_charge_control == 'true' else 'true' }"
  - platform: template
    id: ${charger_id}_sent_ccl
    name: "${ charger_name + ' Sent CCL' if charger_charge_control == 'true' else '' }"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: "mdi:current-dc"
    internal: "${ 'false' if charger_charge_control == 'true' else 'true' }"

text_sensor:
  - platform: template
    id: ${charger_id}_charge_mode
    name: "${ charger_name + ' Charge Mode' if charger_charge_control == 'true' else '' }"
    icon: "mdi:information-outline"
    entity_category: "${ 'diagnostic' if charger_charge_control == 'true' else '' }"
    internal: "${ 'false' if charger_charge_control == 'true' else 'true' }"

number:
  - platform: template
    name: "${ charger_name + ' CVL Override' if charger_charge_control == 'true' else '' }"
    id: ${charger_id}_cvl_override
    icon: "mdi:flash"
    unit_of_measurement: "V"
    min_value: 0
    max_value: 58
    step: 0.1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: "${ 'config' if charger_charge_control == 'true' else '' }"
    internal: "${ 'false' if charger_charge_control == 'true' else 'true' }"
    mode: box
  - platform: template
    name: "${ charger_name + ' CCL Override' if charger_charge_control == 'true' else '' }"
    id: ${charger_id}_ccl_override
    icon: "mdi:current-dc"
    unit_of_measurement: "A"
    min_value: 0
    max_value: 300
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: "${ 'config' if charger_charge_control == 'true' else '' }"
    internal: "${ 'false' if charger_charge_control == 'true' else 'true' }"
    mode: box

script:
  - id: ${charger_id}_can_link_timer
    mode: restart
    then:
      - delay: ${charger_can_link_timer}
      - lambda: |-
          id(${charger_id}_can_send_data) = false;
          id(${charger_id}_can_status).publish_state(false);

canbus:
  # Listen for inverter ACK (LuxPower/Deye/Pylon reply on 0x305)
  - id: !extend ${canbus_node_id}
    on_frame:
      - can_id: 0x305
        then:
          - lambda: |-
              id(${charger_id}_can_link_timer).execute();
              if (id(${charger_id}_can_status).state == false) {
                id(${charger_id}_can_send_data) = true;
                id(${charger_id}_can_status).publish_state(true);
              }
              // Inverter ACK interval (ms)
              uint32_t now = millis();
              if (id(${charger_id}_inverter_ack_ms_previous) > 0) {
                id(${charger_id}_inverter_heartbeat).publish_state(
                  now - id(${charger_id}_inverter_ack_ms_previous));
              }
              id(${charger_id}_inverter_ack_ms_previous) = now;

interval:
  # +----------------------------------------------+
  # | Charge mode text + status                    |
  # +----------------------------------------------+
  - interval: 1s
    then:
      - lambda: |-
          std::string mode;
          if (!id(${proxy_id}_ble_connected).state) {
            mode = "BLE Disconnected";
          } else if (!id(${charger_id}_can_send_data)) {
            mode = "Inverter Offline";
          } else if (!${charger_charge_control}) {
            mode = "Monitoring";
          } else if (id(${charger_id}_charge_enable).state) {
            mode = "Charging Allowed";
          } else {
            mode = "Charging Blocked";
          }
          if (!id(${charger_id}_charge_mode).has_state() || id(${charger_id}_charge_mode).state != mode) {
            id(${charger_id}_charge_mode).publish_state(mode);
          }

  # Kickstart CAN output when BLE is connected (covers inverters that
  # do not send a 0x305 ACK — the link timer stops it after 5s if idle)
  - interval: 30s
    then:
      - lambda: |-
          if (id(${charger_id}_can_send_data) == false && id(${proxy_id}_ble_connected).state) {
            id(${charger_id}_can_send_data) = true;
            id(${charger_id}_can_link_timer).execute();
            ESP_LOGD("charger_can", "[${charger_id}] CAN bus starting...");
          }

  # +----------------------------------------------+
  # | LuxPower frame round-robin (100ms per frame) |
  # +----------------------------------------------+
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: |-
              // Gate: BLE connected, CAN enabled, and battery data ready
              if (!id(${proxy_id}_ble_connected).state) return false;
              if (!id(${charger_id}_can_send_data)) return false;
              if (std::isnan(id(${proxy_id}_voltage).state) ||
                  std::isnan(id(${proxy_id}_current).state) ||
                  std::isnan(id(${proxy_id}_soc).state)) return false;

              // LuxPower : frames 1-6
              int index = id(${charger_id}_can_frame_index);
              int can_frame[] = {1, 2, 3, 4, 5, 6};
              index = (index >= 5) ? 0 : index + 1;
              id(${charger_id}_can_frame) = can_frame[index];
              id(${charger_id}_can_frame_index) = index;
              return true;
          then:
            # +----------------------------------------------+
            # | Frame 1: 0x35E - Manufacturer name           |
            # +----------------------------------------------+
            - if:
                condition:
                  lambda: return id(${charger_id}_can_frame) == 1;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x35E
                      # "YamBMS" matches the upstream LuxPower path. Some
                      # LuxPower firmwares prefer "PYLON   "
                      # ({0x50,0x59,0x4C,0x4F,0x4E,0x20,0x20,0x20}).
                      data: [0x59, 0x61, 0x6D, 0x42, 0x4D, 0x53, 0x00, 0x00]

            # +----------------------------------------------+
            # | Frame 2: 0x351 - Charge/Discharge limits     |
            # +----------------------------------------------+
            # Byte [00:01] = CVL : Charge Limit Voltage     (0.1 V)
            # Byte [02:03] = CCL : Charge Limit Current     (0.1 A)
            # Byte [04:05] = DCL : Discharge Limit Current  (0.1 A)
            # Byte [06:07] = DVL : Discharge Limit Voltage  (0.1 V)
            #
            # Charge control: applies CVL/CCL overrides and, when charging
            # is blocked, reports CVL = pack voltage and CCL = 0 to stop
            # the charger (mirrors the RS485 0x63 handler).
            - if:
                condition:
                  lambda: return id(${charger_id}_can_frame) == 2;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x351
                      data: !lambda |-
                        float reported_cvl = id(${proxy_id}_charge_voltage).state;
                        float reported_ccl = id(${proxy_id}_charge_current).state;
                        float voltage = id(${proxy_id}_voltage).state;
                        bool charge_ok = ${charger_charge_control} ? id(${charger_id}_charge_enable).state : true;

                        // Apply CVL/CCL overrides (0 = use BMS value)
                        float cvl_ovr = 0;
                        float ccl_ovr = 0;
                        if (${charger_charge_control}) {
                          cvl_ovr = id(${charger_id}_cvl_override).state;
                          ccl_ovr = id(${charger_id}_ccl_override).state;
                          if (!std::isnan(cvl_ovr) && cvl_ovr > 0) reported_cvl = cvl_ovr;
                          if (!std::isnan(ccl_ovr) && ccl_ovr > 0) reported_ccl = ccl_ovr;
                        }

                        // Block charging: hold CVL at pack voltage, CCL = 0
                        if (!charge_ok) {
                          reported_cvl = voltage;
                          reported_ccl = 0.0f;
                        }

                        uint8_t m[8];
                        m[0] = uint16_t(reported_cvl * 10) & 0xff;
                        m[1] = uint16_t(reported_cvl * 10) >> 8 & 0xff;
                        m[2] = uint16_t(reported_ccl * 10) & 0xff;
                        m[3] = uint16_t(reported_ccl * 10) >> 8 & 0xff;
                        m[4] = uint16_t(id(${proxy_id}_discharge_current).state * 10) & 0xff;
                        m[5] = uint16_t(id(${proxy_id}_discharge_current).state * 10) >> 8 & 0xff;
                        m[6] = uint16_t(id(${proxy_id}_discharge_voltage).state * 10) & 0xff;
                        m[7] = uint16_t(id(${proxy_id}_discharge_voltage).state * 10) >> 8 & 0xff;

                        if (${charger_charge_control}) {
                          id(${charger_id}_sent_cvl).publish_state(reported_cvl);
                          id(${charger_id}_sent_ccl).publish_state(reported_ccl);
                        }
                        ESP_LOGI("charger_can", "0x351: CVL=%.1fV CCL=%.1fA %s%s",
                          reported_cvl, reported_ccl,
                          charge_ok ? "CHARGE ON" : "CHARGE BLOCKED",
                          (cvl_ovr > 0 || ccl_ovr > 0) ? " [OVERRIDE]" : "");
                        return {m[0], m[1], m[2], m[3], m[4], m[5], m[6], m[7]};

            # +----------------------------------------------+
            # | Frame 3: 0x355 - SOC / SOH (+ cell V)        |
            # +----------------------------------------------+
            # Byte [00:01] = SOC                (1 %)
            # Byte [02:03] = SOH                (1 %)
            # Byte [04:05] = Max cell voltage   (1 mV)  (LuxPower)
            # Byte [06:07] = Min cell voltage   (1 mV)  (LuxPower)
            #
            # Charge control: SOC is spoofed to 100% while blocked so the
            # inverter stops trying to charge.
            - if:
                condition:
                  lambda: return id(${charger_id}_can_frame) == 3;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x355
                      data: !lambda |-
                        float soc = id(${proxy_id}_soc).state;
                        float soh = id(${proxy_id}_soh).state;
                        if (std::isnan(soh)) soh = 100.0f;
                        bool charge_ok = ${charger_charge_control} ? id(${charger_id}_charge_enable).state : true;
                        float reported_soc = charge_ok ? soc : 100.0f;

                        float max_cv = id(${proxy_id}_max_cell_voltage).state;
                        float min_cv = id(${proxy_id}_min_cell_voltage).state;
                        if (std::isnan(max_cv)) max_cv = id(${proxy_id}_voltage).state / 16.0f;
                        if (std::isnan(min_cv)) min_cv = max_cv;
                        int max_cv_mv = max_cv * 1000.0;
                        int min_cv_mv = min_cv * 1000.0;

                        uint8_t m[8];
                        m[0] = uint16_t(reported_soc) & 0xff;
                        m[1] = uint16_t(reported_soc) >> 8 & 0xff;
                        m[2] = uint16_t(soh) & 0xff;
                        m[3] = uint16_t(soh) >> 8 & 0xff;
                        m[4] = max_cv_mv & 0xff;
                        m[5] = max_cv_mv >> 8 & 0xff;
                        m[6] = min_cv_mv & 0xff;
                        m[7] = min_cv_mv >> 8 & 0xff;
                        ESP_LOGD("charger_can", "0x355: SOC=%.0f%% SOH=%.0f%%%s",
                          reported_soc, soh, charge_ok ? "" : " [SPOOFED]");
                        return {m[0], m[1], m[2], m[3], m[4], m[5], m[6], m[7]};

            # +----------------------------------------------+
            # | Frame 4: 0x356 - Voltage / Current / Temp    |
            # +----------------------------------------------+
            # Byte [00:01] = Voltage          (0.01 V)
            # Byte [02:03] = Current          (0.1 A)
            # Byte [04:05] = Max cell temp    (0.1 °C)  (LuxPower)
            # Byte [06:07] = Min cell temp    (0.1 °C)  (LuxPower)
            - if:
                condition:
                  lambda: return id(${charger_id}_can_frame) == 4;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x356
                      data: !lambda |-
                        float max_t = id(${proxy_id}_max_temperature).state;
                        float min_t = id(${proxy_id}_min_temperature).state;
                        if (std::isnan(max_t)) max_t = 25.0f;
                        if (std::isnan(min_t)) min_t = max_t;

                        uint8_t m[8];
                        m[0] = uint16_t(id(${proxy_id}_voltage).state * 100) & 0xff;
                        m[1] = uint16_t(id(${proxy_id}_voltage).state * 100) >> 8 & 0xff;
                        m[2] = int16_t(id(${proxy_id}_current).state * 10) & 0xff;
                        m[3] = int16_t(id(${proxy_id}_current).state * 10) >> 8 & 0xff;
                        // +0.1 °C safeguard so max and min are never equal
                        m[4] = int16_t(max_t * 10 + 1) & 0xff;
                        m[5] = int16_t(max_t * 10 + 1) >> 8 & 0xff;
                        m[6] = int16_t(min_t * 10) & 0xff;
                        m[7] = int16_t(min_t * 10) >> 8 & 0xff;
                        ESP_LOGD("charger_can", "0x356: V=%.2fV I=%.1fA",
                          id(${proxy_id}_voltage).state, id(${proxy_id}_current).state);
                        return {m[0], m[1], m[2], m[3], m[4], m[5], m[6], m[7]};

            # +----------------------------------------------+
            # | Frame 5: 0x359 - Alarms/Warnings (+ capacity)|
            # +----------------------------------------------+
            # Byte [00:01] = Alarm bytes
            # Byte [02:03] = Warning bytes
            # Byte [04]    = BMS combined count
            # Byte [05:06] = Battery capacity (1 Ah)  (LuxPower)
            - if:
                condition:
                  lambda: return id(${charger_id}_can_frame) == 5;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x359
                      data: !lambda |-
                        uint8_t m[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        uint16_t errors_alarm = (uint16_t)id(${proxy_id}_errors_bitmask_alarm).state;
                        uint16_t errors_warning = (uint16_t)id(${proxy_id}_errors_bitmask_warning).state;

                        // Alarm bytes 0-1
                        if (errors_alarm > 0) {
                          if (errors_alarm & 0x0002) m[0] |= 0x02;  // OVP
                          if (errors_alarm & 0x0004) m[0] |= 0x04;  // UVP
                          if (errors_alarm & 0x0008) m[0] |= 0x08;  // OTP
                          if (errors_alarm & 0x0020) m[0] |= 0x08;  // COTP
                          if (errors_alarm & 0x0010) m[0] |= 0x10;  // UTP
                          if (errors_alarm & 0x0040) m[0] |= 0x10;  // CUTP
                          if (errors_alarm & 0x0080) m[0] |= 0x80;  // DOCP
                          if (errors_alarm & 0x0100) m[1] |= 0x80;  // COCP
                          if (errors_alarm & 0x0800) m[1] |= 0x08;  // BMS Internal
                          if (errors_alarm & 0x1000) m[1] |= 0x10;  // UnBalanced Cell
                        }

                        // Warning bytes 2-3
                        if (errors_warning > 0) {
                          if (errors_warning & 0x0002) m[2] |= 0x02;  // OVP
                          if (errors_warning & 0x0004) m[2] |= 0x04;  // UVP
                          if (errors_warning & 0x0008) m[2] |= 0x08;  // OTP
                          if (errors_warning & 0x0020) m[2] |= 0x08;  // COTP
                          if (errors_warning & 0x0010) m[2] |= 0x10;  // UTP
                          if (errors_warning & 0x0040) m[2] |= 0x10;  // CUTP
                          if (errors_warning & 0x0080) m[2] |= 0x80;  // DOCP
                          if (errors_warning & 0x0100) m[3] |= 0x80;  // COCP
                          if (errors_warning & 0x0800) m[3] |= 0x08;  // BMS Internal
                          if (errors_warning & 0x1000) m[3] |= 0x10;  // UnBalanced Cell
                        }

                        m[4] = (uint8_t)id(${proxy_id}_bms_combined).state;

                        // LuxPower: bytes 5-6 = battery capacity (1 Ah)
                        m[5] = uint16_t(id(${proxy_id}_capacity).state) & 0xff;
                        m[6] = uint16_t(id(${proxy_id}_capacity).state) >> 8 & 0xff;

                        ESP_LOGD("charger_can", "0x359: alarm=0x%04X warning=0x%04X", errors_alarm, errors_warning);
                        return {m[0], m[1], m[2], m[3], m[4], m[5], m[6], m[7]};

            # +----------------------------------------------+
            # | Frame 6: 0x35C - Charge/Discharge flags      |
            # +----------------------------------------------+
            # Byte [00] bit 4: Request force charge 2
            # Byte [00] bit 6: Discharge enable
            # Byte [00] bit 7: Charge enable
            # Byte [02:03]   : Cycle count (LuxPower)
            #
            # Charge control: the charge-enable / force-charge bits are
            # cleared while charging is blocked.
            - if:
                condition:
                  lambda: return id(${charger_id}_can_frame) == 6;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x35C
                      data: !lambda |-
                        uint8_t m[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        bool charge_ok = ${charger_charge_control} ? id(${charger_id}_charge_enable).state : true;

                        // Bit 4: Force charge (suppressed while blocked)
                        if (id(${proxy_id}_force_charge).state && charge_ok) m[0] |= 0x10;
                        // Bit 6: Discharge enable
                        if (id(${proxy_id}_discharge_enabled).state) m[0] |= 0x40;
                        // Bit 7: Charge enable (BMS allows AND not blocked)
                        if (id(${proxy_id}_charge_enabled).state && charge_ok) m[0] |= 0x80;

                        // LuxPower: bytes 2-3 = cycle count
                        m[2] = uint16_t(id(${proxy_id}_charging_cycles).state) & 0xff;
                        m[3] = uint16_t(id(${proxy_id}_charging_cycles).state) >> 8 & 0xff;

                        ESP_LOGD("charger_can", "0x35C: flags=0x%02X %s", m[0],
                          charge_ok ? "CHARGE ON" : "CHARGE BLOCKED");
                        return {m[0], m[1], m[2], m[3], m[4], m[5], m[6], m[7]};
