# +--------------------------------------+
# | BLE Charger Proxy - CAN Example      |
# +--------------------------------------+
# Node B: BLE Client → LuxPower CAN output with charge control
# Connects to YamBMS BLE server and presents itself to a LuxPower
# inverter/charger as the battery BMS, with charge blocking and
# CVL/CCL overrides.
#
# CAN sibling of YamBMS_Charger_Proxy_Example.yaml (RS485).
# See CHARGER_PROXY_README.md for full documentation.

esphome:
  name: charger-proxy-can
  friendly_name: "Charger Proxy CAN"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# +--------------------------------------+
# | Proxy Configuration                  |
# +--------------------------------------+
substitutions:
  proxy_id: 'ew_proxy'
  # BLE Server MAC address (Node A / YamBMS)
  # Get this from Node A logs after first boot
  # Format: XX:XX:XX:XX:XX:XX
  yambms_server_mac: 'AA:BB:CC:DD:EE:FF'  # <- Change this!

# +--------------------------------------+
# | CAN bus hardware                     |
# +--------------------------------------+
# ESP32 built-in CAN (TWAI) controller. Adjust TX/RX pins to your
# wiring. The charger package extends this bus to listen for the
# inverter ACK (0x305) and to send the LuxPower frames.
canbus:
  - platform: esp32_can
    id: canbus_proxy
    tx_pin: GPIO5
    rx_pin: GPIO4
    can_id: 1
    bit_rate: 500kbps

# +--------------------------------------+
# | BLE Client + Charger CAN packages    |
# +--------------------------------------+
packages:
  # BLE Client - connects to YamBMS BLE server
  ble_client:
    url: https://github.com/RAR/esphome-yambms-addons
    ref: main
    refresh: 0s
    files:
      - path: 'packages/inverter/inverter_proxy_ble_client.yaml'

  # Charger CAN - LuxPower output with charge control
  charger_can:
    url: https://github.com/RAR/esphome-yambms-addons
    ref: main
    refresh: 0s
    files:
      - path: 'packages/charger/charger_proxy_canbus.yaml'
        vars:
          charger_id: 'charger_can'
          charger_name: 'Charger CAN'
          canbus_node_id: 'canbus_proxy'
          # charger_charge_control: 'false'   # uncomment for monitoring-only

# +--------------------------------------+
# | Setup Instructions                   |
# +--------------------------------------+
# 1. Flash Node A (YamBMS Server) first
#    - Include yambms_ble_server.yaml in your YamBMS config
# 2. Check Node A logs for BLE MAC address
# 3. Update yambms_server_mac above with Node A's MAC
# 4. Adjust CAN TX/RX pins for your board
# 5. Flash this Node B
# 6. Node B will auto-connect to Node A via BLE
# 7. Connect CAN bus to the inverter/charger (CAN-H / CAN-L)
#    - Add 120Ω termination resistor if needed
# 8. Set the inverter's battery protocol to LuxPower
# 9. Toggle "Charge Enable" switch in HA to control charging
